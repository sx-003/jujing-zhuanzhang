name: tmp-anysearch-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 强制走 Anysearch 兜底
        env:
          ANYSEARCH_KEYS: ${{ secrets.ANYSEARCH_KEYS }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          sys.path.insert(0, ".")
          keys = [k.strip() for k in os.environ.get("ANYSEARCH_KEYS", "").replace(";", ",").split(",") if k.strip()]
          print("key_count", len(keys))
          assert keys, "missing ANYSEARCH_KEYS"

          body = json.dumps({"query": "whale transfer to exchange", "max_results": 3}).encode()
          req = urllib.request.Request(
              "https://api.anysearch.com/v1/search", data=body, method="POST",
              headers={"Content-Type": "application/json",
                       "Authorization": "Bearer " + keys[0], "X-API-Key": keys[0],
                       "User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              status = resp.status
              payload = json.loads(resp.read().decode("utf-8"))
          results = (payload.get("data") or {}).get("results") or []
          print("direct_http_status", status, "api_code", payload.get("code"), "results", len(results))
          assert status == 200 and payload.get("code") == 0 and results, payload

          from monitor import cloud

          hits = cloud.anysearch_search("whale transfer to exchange", keys[0])
          print("direct_hits", len(hits), [h.url for h in hits[:3]])
          assert hits, "anysearch_search 解析不到命中"

          def exa_off(*args, **kwargs):
              raise RuntimeError("EXA_DISABLED_FOR_ANYSEARCH_TEST")

          cloud.exa_search = exa_off
          report = cloud.run_cloud({}, max_queries=2)
          data = report.to_dict()
          print("cloud_report", json.dumps(data, ensure_ascii=False))
          print("anysearch_engine_count", data["engine_counts"].get("anysearch", 0))
          assert data["engine_counts"].get("anysearch", 0) > 0, "兜底被调用但没有 anysearch 命中"
          assert any("Anysearch 兜底成功" in e for e in data["errors"]), data["errors"]
          bad = [e for e in data["errors"] if "provider_error" in e or " 401" in e or " 403" in e]
          assert not bad, bad
          print("ANYSEARCH_FALLBACK_OK")
          PY
